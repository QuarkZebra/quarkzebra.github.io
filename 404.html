<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — mathbrown.com</title>
<script>
/* Forgive any capitalization: /MHF4U, /Mhf4u, /mhf4u/... all forward to the
   lowercase course site, keeping the rest of the path, query and hash. */
(function(){
  var courses={mhf4u:1,mcr3u:1,mth1w:1};
  var parts=location.pathname.split("/").filter(Boolean);
  var seg=parts[0]||"", low=seg.toLowerCase();
  if(courses[low]&&seg!==low){
    parts[0]=low;
    location.replace("/"+parts.join("/")+(parts.length>1?"":"/")+location.search+location.hash);
  }
})();
</script>
<style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:90vh}
p{text-align:center;line-height:2}</style>
</head>
<body>
<p>That page isn&rsquo;t here.<br><a href="/">mathbrown.com</a></p>
</body>
</html>
